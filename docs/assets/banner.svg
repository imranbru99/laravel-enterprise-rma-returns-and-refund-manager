<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Subtle Ambient Glows -->
  <circle cx="150" cy="80" r="120" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1050" cy="300" r="160" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="600" cy="380" r="100" fill="#a855f7" opacity="0.1" filter="url(#glow)"/>

  <!-- Grid Pattern Overlay -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.2">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Top Pill / Badge -->
  <g transform="translate(60, 42)">
    <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
    <circle cx="16" cy="16" r="5" fill="#38bdf8"/>
    <text x="30" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">NEXT-GEN ENTERPRISE RMA SAAS</text>
  </g>

  <!-- Main Headline -->
  <text x="60" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
    Returns &amp; Refund Manager
  </text>

  <!-- Gradient Subtitle -->
  <text x="60" y="172" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700">
    Automate Reverse Logistics • Eliminate 94% Return Fraud • Retain 42% Capital
  </text>

  <!-- Description Text -->
  <text x="60" y="215" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
    The all-in-one PHP 8.5, Laravel 13 &amp; Filament v5 enterprise returns platform with 90 configurable modules,
  </text>
  <text x="60" y="238" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
    multi-branch BORIS intake, AI reason classification, double-entry financial journals, and warranty repair centers.
  </text>

  <!-- Metric Badges Row -->
  <g transform="translate(60, 275)">
    <!-- Metric 1: Time Saved -->
    <rect x="0" y="0" width="240" height="85" rx="12" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="38" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800">82%</text>
    <text x="20" y="62" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Faster RMA Processing</text>
    <text x="20" y="76" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">from 7 days down to 24 hrs</text>

    <!-- Metric 2: Fraud Protection -->
    <rect x="260" y="0" width="240" height="85" rx="12" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
    <text x="280" y="38" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800">94%</text>
    <text x="280" y="62" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Fraud &amp; Abuse Blocked</text>
    <text x="280" y="76" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">via AI risk score model</text>

    <!-- Metric 3: Configurable Modules -->
    <rect x="520" y="0" width="240" height="85" rx="12" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
    <text x="540" y="38" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800">90</text>
    <text x="540" y="62" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Turnkey Modules</text>
    <text x="540" y="76" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">toggle on/off per tenant</text>

    <!-- Metric 4: Financial Zero Error -->
    <rect x="780" y="0" width="240" height="85" rx="12" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
    <text x="800" y="38" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800">100%</text>
    <text x="800" y="62" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Double-Entry Balance</text>
    <text x="800" y="76" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">idempotent refund locks</text>
  </g>

  <!-- Tech Stack Pills Bottom Right -->
  <g transform="translate(60, 385)">
    <rect x="0" y="0" width="95" height="24" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="47" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">PHP 8.5+</text>

    <rect x="105" y="0" width="105" height="24" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="157" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Laravel 13.x</text>

    <rect x="220" y="0" width="105" height="24" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="272" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Filament v5</text>

    <rect x="335" y="0" width="115" height="24" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="392" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Multi-Tenant</text>

    <rect x="460" y="0" width="125" height="24" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="522" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AI Intelligence</text>

    <rect x="595" y="0" width="140" height="24" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="665" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Docker &amp; CI Ready</text>
  </g>
</svg>
